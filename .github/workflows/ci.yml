name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Cross-compiles for vxWorks 5.2 / mv167 with ANL's 32-bit Linux 68k
        # tools; the host only has to run those. EL9 only -- and el_version
        # defaults to 8, so it must be named explicitly.
        el: ['9']
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/ci.yml@main
    with:
      scripts_dir: gemini-rtsw-ci
      el_version: ${{ matrix.el }}

  # Rebuilds rpm-repo:latest ONCE after all EL legs have pushed their scratch
  # tags. Without this the RPM never lands in the served repo.
  publish:
    needs: build
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/publish.yml@main
    secrets: inherit
