# What makes a build THIS build. The single source for these values, read by
#
#   tools/linux-build/setup.sh   (sourced as shell)
#   config/CONFIG.Defs           (included as make, via setup.sh)
#   gnirscc.spec                 (read with %(...))
#
# so a local `make` and the pipeline's rpmbuild cannot disagree. Plain
# KEY=value with no spaces, so that sh and make both parse it.

# Where the crate boots this tree from. The boot parameter reads
#   /gemini/GEM5/gnirs/CC/CC/bin/mv167/startup.IS
# -- today CC is a selector symlink to the release of the day; the RPM makes it
# a real directory, so the boot parameter does not change.
DEPLOY=/gemini/GEM5/gnirs/CC/CC

# CONFIG_APPLIC splits APPLIC_IOCPATH on ':' and takes DIST_PATH from word 2,
# so it must be HOST:PATH -- a bare path gives `cd "/.."` in the startup. The
# host half is vestigial (rdist's old target) but the split needs it.
IOCPATH_HOST=mkotcsbootv2-lv1

# The Instrument Sequencer, loaded into this same crate by startup.IS.
IS_DEPLOY=/gemini/GEM5/gnirs/IS/IS
